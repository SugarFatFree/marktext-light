name: Tauri Build

# Builds the (in-progress) Tauri shell on GitHub-hosted runners so we don't need
# a local Rust + webkit2gtk toolchain, and publishes the installers as Release
# assets for the size / startup comparison against the Electron build.
#
# Triggered manually (workflow_dispatch), on merge to develop, or by a `v*` tag
# — deliberately NOT on every PR sync: a 4-platform Rust build is expensive and,
# when it ran on each push, its jobs competed with ~12 other PR workflows for
# runners. Keeping it manual gives a clean, contention-free signal (important
# while runner scheduling is degraded).
#
# A `v*` tag is what makes a release: this is the only place the four platforms
# are built, so the installers a release hands out can only come from here.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches: [develop]
    paths:
      - 'packages/desktop/src-tauri/**'
      - 'packages/desktop/vite.tauri.config.ts'
      - 'packages/desktop/src/renderer/**'
      - 'packages/desktop/static/**'
      - 'packages/desktop/src/common/**'
      - 'packages/desktop/src/shared/**'
      - 'packages/muya/**'
      - 'packages/muyajs/**'
      - 'packages/desktop/package.json'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/tauri-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            platform: linux
          - name: windows-x64
            os: windows-latest
            platform: windows
          - name: macos-arm64
            os: macos-15
            platform: macos
          - name: macos-x64
            os: macos-15-intel
            platform: macos

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      # Tauri's Linux webview stack — the dependency this project can't install
      # locally without sudo.
      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file

      - name: Setup pnpm + Node
        uses: ./.github/actions/setup

      # Each runner is native to its arch (macos-15-intel = x64,
      # macos-15 = arm64), so a plain native build lands in target/release/bundle.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      # tauri:build = minify-locales → vite build (renderer) → cargo build + bundle.
      - name: Build Tauri app
        run: pnpm -C packages/desktop run tauri:build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Linux only: these are pure-logic tests with nothing platform-specific to
      # say, so running them on all four runners would quadruple the cost for
      # the same answer. `--release` reuses what the build above just compiled;
      # the default dev profile would rebuild every dependency from scratch.
      - name: Run Rust tests
        if: matrix.platform == 'linux'
        run: cargo test --release --manifest-path packages/desktop/src-tauri/Cargo.toml

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: marktext-tauri-${{ matrix.name }}
          retention-days: 30
          if-no-files-found: error
          path: |
            packages/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            packages/desktop/src-tauri/target/release/bundle/deb/*.deb
            packages/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
            packages/desktop/src-tauri/target/release/bundle/msi/*.msi
            packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz

  # GitHub *artifacts* are always downloaded as a .zip wrapper — there is no way
  # to disable that. To hand out the raw installer files, publish them as
  # Release assets instead (Release downloads are the bare files, no zip).
  release:
    name: Publish raw installers
    needs: build
    # Publish whatever built successfully even if a platform leg flaked
    # (macOS runners are occasionally cancelled while queued) — a flaky leg must
    # not block handing out the installers that did build.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installer files
        id: collect
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
            -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
            -o -name '*.app.tar.gz' \) -exec cp -f {} release/ \;
          count=$(find release -type f | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Collected $count installers:"
          ls -la release

      # A tagged build is a release; anything else refreshes the moving preview.
      # Both paths publish the same collected installers — the only differences
      # are the tag they hang off and whether it is marked as a prerelease.
      - name: Publish the release
        if: ${{ steps.collect.outputs.count != '0' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # A version tag names one commit forever, so its release is created
          # once and never refreshed. Re-running the workflow on the same tag
          # uploads the assets again rather than starting over, so that a single
          # flaked platform leg can be filled in without dropping what built.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "marktext-light ${tag}" \
              --generate-notes
          fi

      - name: Refresh the tauri-preview prerelease
        if: ${{ steps.collect.outputs.count != '0' && !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="tauri-preview"
          # Refresh the moving preview tag so the assets are always this build.
          gh release delete "$tag" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "$tag" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "marktext-light — Tauri preview build" \
            --notes "Raw installer files (no zip wrapper). Built from ${GITHUB_SHA}."
