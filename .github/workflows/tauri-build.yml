name: Tauri Build

# Builds the (in-progress) Tauri shell on GitHub-hosted runners so we don't need
# a local Rust + webkit2gtk toolchain. Produces installers as artifacts for the
# size / startup comparison against the Electron build.
#
# Manual by default (workflow_dispatch); also runs on pushes/PRs that touch the
# Tauri surface so regressions surface early.

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'packages/desktop/src-tauri/**'
      - 'packages/desktop/vite.tauri.config.ts'
      - 'packages/desktop/src/renderer/src/tauri-bridge/**'
      - '.github/workflows/tauri-build.yml'
  pull_request:
    paths:
      - 'packages/desktop/src-tauri/**'
      - 'packages/desktop/vite.tauri.config.ts'
      - 'packages/desktop/src/renderer/src/tauri-bridge/**'
      - '.github/workflows/tauri-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            platform: linux
          - name: windows-x64
            os: windows-latest
            platform: windows
          - name: macos-arm64
            os: macos-15
            platform: macos
          - name: macos-x64
            os: macos-15-intel
            platform: macos

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      # Tauri's Linux webview stack — the dependency this project can't install
      # locally without sudo.
      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file

      - name: Setup pnpm + Node
        uses: ./.github/actions/setup

      # Each runner is native to its arch (macos-15-intel = x64,
      # macos-15 = arm64), so a plain native build lands in target/release/bundle.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      # tauri:build = minify-locales → vite build (renderer) → cargo build + bundle.
      - name: Build Tauri app
        run: pnpm -C packages/desktop run tauri:build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: marktext-tauri-${{ matrix.name }}
          retention-days: 30
          if-no-files-found: error
          path: |
            packages/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            packages/desktop/src-tauri/target/release/bundle/deb/*.deb
            packages/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
            packages/desktop/src-tauri/target/release/bundle/msi/*.msi
            packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
