name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # packages/muya (TS v2) self-lints via .github/workflows/muya.yml.
    # Skip the desktop lint+typecheck on muya-only PRs.
    paths-ignore:
      - 'packages/muya/**'
  # Also on a push to develop, not only on pull requests. Day-to-day work lands
  # on develop directly, so with a pull-request-only trigger this suite stopped
  # running at all — every commit between releases went out on local checks
  # alone, and the one thing a local check cannot do is launch the app.
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck
