[package]
name = "marktext"
version = "1.0.0"
description = "MarkText — next generation markdown editor"
authors = ["Jocs"]
edition = "2021"
rust-version = "1.77.2"

# The library the desktop binary links against. Keeping a lib target lets
# integration tests and (future) mobile targets share the command surface.
[lib]
name = "marktext_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` keeps the WebView inspector (F12 / right-click → Inspect) available
# in release builds too, so the renderer console is reachable while the Tauri
# migration is still being verified.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
# A second launch must reuse the running window (one window, many tabs).
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Detect the OS UI language to localize the native application menu.
sys-locale = "0.3"
# Recoverable delete for the sidebar's context menu (Electron's shell.trashItem).
trash = "5"
# Pattern matching for project-wide search; Tauri ships no ripgrep binary.
regex = "1"
# Filesystem watching for the sidebar tree (chokidar's replacement).
notify = "6"
# Decoding markdown files that are not UTF-8. Electron used iconv-lite + ced;
# these are the same two jobs — encoding_rs decodes, chardetng guesses — and are
# the pair Firefox itself ships. Without them a GBK or Big5 file cannot be
# opened at all, and a UTF-8 file with a byte-order mark loses its first
# heading. See commands/markdown.rs.
encoding_rs = "0.8"
chardetng = "0.1"

[features]
# Enabled by tauri when building for production; forwarded from tauri.conf.json.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Optimize the shipped binary for size — one of the reasons we moved off
# Electron. `opt-level = "s"` + LTO + stripped symbols keeps the installer small.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
